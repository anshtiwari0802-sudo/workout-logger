<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Workout Logger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.9.0/jsrsasign-all-min.js"></script>
<style>
  :root {
    --bg: #0e0f11;
    --surface: #16181c;
    --surface2: #1e2026;
    --border: #2a2d35;
    --text: #f0f1f3;
    --text2: #8b8f9a;
    --text3: #55596a;
    --green: #3ecf8e;
    --green-bg: #0d2b1e;
    --red: #e85d5d;
    --blue: #5b9cf6;
    --yellow: #f5c542;
    --radius: 14px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }

  /* HEADER */
  .header { padding: 56px 20px 16px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .header h1 span { color: var(--green); }
  .header-date { font-size: 12px; color: var(--text3); }

  /* SCREEN MANAGEMENT */
  .screen { display: none; padding: 0 16px; }
  .screen.active { display: block; }

  /* DAY PICKER */
  .day-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .day-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 14px;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--text);
  }
  .day-btn:active { opacity: 0.7; transform: scale(0.98); }
  .day-btn .day-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .day-btn .day-type { font-size: 12px; color: var(--text2); }
  .day-btn .day-dot { width: 8px; height: 8px; border-radius: 50%; margin-bottom: 10px; }
  .rest-btn { grid-column: span 2; background: var(--surface2); }

  /* SECTION LABEL */
  .section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); margin: 20px 0 10px; }

  /* BACK BTN */
  .back-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--text2); font-size: 15px; cursor: pointer; padding: 0; margin-bottom: 16px; }
  .back-btn:active { opacity: 0.6; }

  /* DAY TITLE */
  .day-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .day-subtitle { font-size: 13px; color: var(--text2); margin-bottom: 20px; }

  /* EXERCISE LIST */
  .ex-list { display: flex; flex-direction: column; gap: 8px; }
  .ex-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--text);
    width: 100%;
    text-align: left;
  }
  .ex-btn:active { opacity: 0.7; }
  .ex-btn.logged { border-color: var(--green); background: var(--green-bg); }
  .ex-btn-name { font-size: 15px; font-weight: 500; }
  .ex-btn-status { font-size: 12px; color: var(--text3); }
  .ex-btn.logged .ex-btn-status { color: var(--green); }

  /* LOG FORM */
  .ex-form-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .ex-form-sub { font-size: 13px; color: var(--text2); margin-bottom: 24px; }

  .form-group { margin-bottom: 20px; }
  .form-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; display: block; }

  /* SET SELECTOR */
  .set-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .set-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 8px;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
    transition: all 0.15s;
  }
  .set-btn.active { background: var(--green); color: #0a1a12; border-color: var(--green); }
  .set-btn:active { opacity: 0.7; }

  /* REPS SELECTOR */
  .reps-selector { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .reps-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 4px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
    transition: all 0.15s;
  }
  .reps-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  .reps-btn:active { opacity: 0.7; }

  /* WEIGHT INPUT */
  .weight-input-wrap { display: flex; align-items: center; gap: 12px; }
  .weight-btn {
    width: 48px; height: 48px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 22px;
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .weight-btn:active { opacity: 0.7; background: var(--surface); }
  .weight-display {
    flex: 1;
    text-align: center;
    font-size: 36px;
    font-weight: 700;
    color: var(--text);
  }
  .weight-unit { font-size: 16px; color: var(--text3); margin-left: 4px; }
  .weight-steps { display: flex; gap: 8px; margin-top: 10px; }
  .weight-step {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px;
    text-align: center;
    font-size: 13px;
    color: var(--text2);
    cursor: pointer;
  }
  .weight-step:active { opacity: 0.7; }

  /* SUBMIT BTN */
  .submit-btn {
    width: 100%;
    background: var(--green);
    color: #0a1a12;
    border: none;
    border-radius: var(--radius);
    padding: 18px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 28px;
    transition: opacity 0.15s;
  }
  .submit-btn:active { opacity: 0.8; }
  .submit-btn:disabled { opacity: 0.4; }

  /* CARDIO FORM */
  .cardio-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 24px;
    font-weight: 700;
    padding: 14px 16px;
    width: 100%;
    outline: none;
    text-align: center;
  }
  .cardio-input:focus { border-color: var(--green); }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--green);
    color: #0a1a12;
    padding: 12px 24px;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 600;
    transition: transform 0.3s ease;
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--red); color: white; }

  /* SUMMARY */
  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
  }
  .summary-ex { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .summary-detail { font-size: 13px; color: var(--text2); }
  .summary-badge { font-size: 11px; background: var(--green-bg); color: var(--green); padding: 2px 8px; border-radius: 4px; display: inline-block; margin-top: 4px; }

  .finish-btn {
    width: 100%;
    background: var(--green);
    color: #0a1a12;
    border: none;
    border-radius: var(--radius);
    padding: 18px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 16px;
  }
  .finish-btn:active { opacity: 0.8; }

  .loading-overlay {
    position: fixed; inset: 0;
    background: rgba(14,15,17,0.85);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 1000;
    display: none;
  }
  .loading-overlay.show { display: flex; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 15px; color: var(--text2); }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>WORK<span>OUT</span></h1>
    <div class="header-date" id="header-date"></div>
  </div>
</div>

<!-- SCREEN 1: DAY PICKER -->
<div class="screen active" id="screen-days">
  <div class="section-label">Pick today's workout</div>
  <div class="day-grid">
    <button class="day-btn" onclick="selectDay('wednesday')">
      <div class="day-dot" style="background:#e85d5d"></div>
      <div class="day-name">Wednesday</div>
      <div class="day-type">Pull + Rear Delts</div>
    </button>
    <button class="day-btn" onclick="selectDay('thursday')">
      <div class="day-dot" style="background:#3ecf8e"></div>
      <div class="day-name">Thursday</div>
      <div class="day-type">Run/Walk Intervals</div>
    </button>
    <button class="day-btn" onclick="selectDay('friday')">
      <div class="day-dot" style="background:#5b9cf6"></div>
      <div class="day-name">Friday</div>
      <div class="day-type">Push + Shoulders</div>
    </button>
    <button class="day-btn" onclick="selectDay('saturday')">
      <div class="day-dot" style="background:#f5c542"></div>
      <div class="day-name">Saturday</div>
      <div class="day-type">Cardio + Core</div>
    </button>
    <button class="day-btn rest-btn" onclick="selectDay('rest')">
      <div class="day-name">😴 Sunday — Rest Day</div>
      <div class="day-type">Recovery. No logging needed.</div>
    </button>
  </div>
</div>

<!-- SCREEN 2: EXERCISE LIST -->
<div class="screen" id="screen-exercises">
  <button class="back-btn" onclick="goBack('screen-days')">← Back</button>
  <div class="day-title" id="ex-day-title"></div>
  <div class="day-subtitle" id="ex-day-subtitle"></div>
  <div class="ex-list" id="ex-list"></div>
  <button class="submit-btn" onclick="showSummary()" id="view-summary-btn" style="margin-top:20px;background:var(--surface);color:var(--text);border:1px solid var(--border);">View Summary</button>
</div>

<!-- SCREEN 3: LOG EXERCISE -->
<div class="screen" id="screen-log">
  <button class="back-btn" onclick="goBack('screen-exercises')">← Back</button>
  <div class="ex-form-title" id="log-ex-name"></div>
  <div class="ex-form-sub">4 sets × 10 reps target</div>

  <div class="form-group">
    <label class="form-label">Set number</label>
    <div class="set-selector" id="set-selector">
      <button class="set-btn" onclick="selectSet(1)">1</button>
      <button class="set-btn" onclick="selectSet(2)">2</button>
      <button class="set-btn" onclick="selectSet(3)">3</button>
      <button class="set-btn" onclick="selectSet(4)">4</button>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Reps completed</label>
    <div class="reps-selector" id="reps-selector">
      <button class="reps-btn" onclick="selectReps(1)">1</button>
      <button class="reps-btn" onclick="selectReps(2)">2</button>
      <button class="reps-btn" onclick="selectReps(3)">3</button>
      <button class="reps-btn" onclick="selectReps(4)">4</button>
      <button class="reps-btn" onclick="selectReps(5)">5</button>
      <button class="reps-btn" onclick="selectReps(6)">6</button>
      <button class="reps-btn" onclick="selectReps(7)">7</button>
      <button class="reps-btn" onclick="selectReps(8)">8</button>
      <button class="reps-btn" onclick="selectReps(9)">9</button>
      <button class="reps-btn" onclick="selectReps(10)">10</button>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Weight</label>
    <div class="weight-input-wrap">
      <button class="weight-btn" onclick="adjustWeight(-currentStep)">−</button>
      <div class="weight-display"><span id="weight-val">45</span><span class="weight-unit">lbs</span></div>
      <button class="weight-btn" onclick="adjustWeight(currentStep)">+</button>
    </div>
    <div class="weight-steps">
      <button class="weight-step" onclick="setStep(2.5)">±2.5</button>
      <button class="weight-step" onclick="setStep(5)">±5</button>
      <button class="weight-step" onclick="setStep(10)">±10</button>
      <button class="weight-step" onclick="setStep(25)">±25</button>
    </div>
  </div>

  <button class="submit-btn" onclick="logSet()" id="log-btn">Log Set</button>
</div>

<!-- SCREEN 4: CARDIO LOG -->
<div class="screen" id="screen-cardio">
  <button class="back-btn" onclick="goBack('screen-exercises')">← Back</button>
  <div class="day-title" id="cardio-title"></div>
  <div class="day-subtitle" id="cardio-subtitle"></div>
  <div id="cardio-form"></div>
  <button class="submit-btn" onclick="logCardio()">Log Session</button>
</div>

<!-- SCREEN 5: SUMMARY -->
<div class="screen" id="screen-summary">
  <button class="back-btn" onclick="goBack('screen-exercises')">← Back</button>
  <div class="day-title">Session Summary</div>
  <div class="day-subtitle" id="summary-date"></div>
  <div id="summary-list" style="margin-top:16px;"></div>
  <button class="finish-btn" onclick="sendToSheets()">✓ Send to Google Sheets</button>
</div>

<!-- LOADING -->
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">Sending to Google Sheets...</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

  },

    exercises: ['Plank','Leg raises','Dead bug'],
    cardioAlso: true
  }
};

// ── STATE ─────────────────────────────────────────────────────────────────────
let currentDay = null;
let currentEx = null;
let currentSet = null;
let currentReps = null;
let currentWeight = 45;
let currentStep = 5;
let sessionLogs = {}; // { exName: [{set, reps, weight}] }
let cardioData = {};

// ── DATE ──────────────────────────────────────────────────────────────────────
const now = new Date();
document.getElementById('header-date').textContent = now.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
document.getElementById('summary-date').textContent = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});

function todayStr() {
  return `${now.getMonth()+1}/${now.getDate()}/${now.getFullYear()}`;
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function goBack(to) { showScreen(to); }

// ── DAY SELECT ────────────────────────────────────────────────────────────────
function selectDay(day) {
  if (day === 'rest') { showToast('Rest day! Recover well 💪'); return; }
  currentDay = day;
  sessionLogs = {};
  cardioData = {};
  const w = WORKOUTS[day];
  document.getElementById('ex-day-title').textContent = w.name;
  document.getElementById('ex-day-subtitle').textContent = w.type;
  buildExList(w);
  showScreen('screen-exercises');
}

function buildExList(w) {
  const list = document.getElementById('ex-list');
  list.innerHTML = '';
  if (w.cardio) {
    // pure cardio day (thursday)
    const btn = document.createElement('button');
    btn.className = 'ex-btn';
    btn.innerHTML = `<span class="ex-btn-name">Run/Walk Session</span><span class="ex-btn-status">Tap to log →</span>`;
    btn.onclick = () => showCardioForm('thursday');
    list.appendChild(btn);
    return;
  }
  if (w.cardioAlso) {
    const btn = document.createElement('button');
    btn.className = 'ex-btn';
    btn.id = 'ex-btn-treadmill';
    btn.innerHTML = `<span class="ex-btn-name">Incline Treadmill Walk</span><span class="ex-btn-status" id="status-treadmill">Tap to log →</span>`;
    btn.onclick = () => showCardioForm('saturday');
    list.appendChild(btn);
  }
  if (w.exercises) {
    w.exercises.forEach(ex => {
      const btn = document.createElement('button');
      btn.className = 'ex-btn';
      btn.id = 'ex-btn-' + ex.replace(/\s+/g,'-');
      btn.innerHTML = `<span class="ex-btn-name">${ex}</span><span class="ex-btn-status" id="status-${ex.replace(/\s+/g,'-')}">Tap to log →</span>`;
      btn.onclick = () => openExercise(ex);
      list.appendChild(btn);
    });
  }
}

// ── EXERCISE LOG ──────────────────────────────────────────────────────────────
function openExercise(ex) {
  currentEx = ex;
  currentSet = null;
  currentReps = null;
  currentWeight = 45;
  document.getElementById('log-ex-name').textContent = ex;
  document.getElementById('weight-val').textContent = currentWeight;
  document.querySelectorAll('.set-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.reps-btn').forEach(b => b.classList.remove('active'));
  // prefill last used set
  const logs = sessionLogs[ex] || [];
  if (logs.length > 0) {
    const last = logs[logs.length-1];
    selectSet(last.set + 1 <= 4 ? last.set + 1 : last.set);
    currentWeight = last.weight;
    document.getElementById('weight-val').textContent = currentWeight;
  }
  showScreen('screen-log');
}

function selectSet(n) {
  currentSet = n;
  document.querySelectorAll('.set-btn').forEach((b,i) => b.classList.toggle('active', i+1===n));
}
function selectReps(n) {
  currentReps = n;
  document.querySelectorAll('.reps-btn').forEach((b,i) => b.classList.toggle('active', i+1===n));
}
function adjustWeight(delta) {
  currentWeight = Math.max(0, currentWeight + delta);
  document.getElementById('weight-val').textContent = currentWeight;
}
function setStep(s) { currentStep = s; }

function logSet() {
  if (!currentSet || !currentReps) { showToast('Pick a set and reps first!', true); return; }
  if (!sessionLogs[currentEx]) sessionLogs[currentEx] = [];
  // remove existing entry for this set
  sessionLogs[currentEx] = sessionLogs[currentEx].filter(l => l.set !== currentSet);
  sessionLogs[currentEx].push({ set: currentSet, reps: currentReps, weight: currentWeight });
  sessionLogs[currentEx].sort((a,b) => a.set - b.set);
  // update button status
  const logs = sessionLogs[currentEx];
  const statusEl = document.getElementById('status-' + currentEx.replace(/\s+/g,'-'));
  const btnEl = document.getElementById('ex-btn-' + currentEx.replace(/\s+/g,'-'));
  if (statusEl) {
    statusEl.textContent = `${logs.length} set${logs.length>1?'s':''} logged ✓`;
    if (btnEl) btnEl.classList.add('logged');
  }
  showToast(`Set ${currentSet} logged — ${currentReps} reps @ ${currentWeight}lbs`);
  goBack('screen-exercises');
}

// ── CARDIO FORM ───────────────────────────────────────────────────────────────
function showCardioForm(type) {
  if (type === 'thursday') {
    document.getElementById('cardio-title').textContent = 'Run/Walk Intervals';
    document.getElementById('cardio-subtitle').textContent = 'Warm up 5min → Run 1min/Walk 2min × 6 → Cool down 4min';
    document.getElementById('cardio-form').innerHTML = `
      <div class="form-group"><label class="form-label">Total minutes completed</label><input class="cardio-input" type="number" id="c-minutes" placeholder="27" inputmode="numeric"/></div>
      <div class="form-group"><label class="form-label">Run rounds completed (target: 6)</label><input class="cardio-input" type="number" id="c-rounds" placeholder="6" inputmode="numeric"/></div>
      <div class="form-group"><label class="form-label">Distance (miles, optional)</label><input class="cardio-input" type="number" id="c-miles" placeholder="1.5" step="0.1" inputmode="decimal"/></div>`;
  } else {
    document.getElementById('cardio-title').textContent = 'Incline Treadmill';
    document.getElementById('cardio-subtitle').textContent = 'Incline 8-12%, Speed 3-3.5mph';
    document.getElementById('cardio-form').innerHTML = `
      <div class="form-group"><label class="form-label">Minutes completed (target: 30-35)</label><input class="cardio-input" type="number" id="c-minutes" placeholder="32" inputmode="numeric"/></div>
      <div class="form-group"><label class="form-label">Incline %</label><input class="cardio-input" type="number" id="c-rounds" placeholder="10" inputmode="numeric"/></div>`;
  }
  cardioData.type = type;
  showScreen('screen-cardio');
}

function logCardio() {
  const mins = document.getElementById('c-minutes')?.value;
  const rounds = document.getElementById('c-rounds')?.value;
  const miles = document.getElementById('c-miles')?.value;
  if (!mins) { showToast('Enter minutes at least!', true); return; }
  cardioData.mins = mins;
  cardioData.rounds = rounds || '';
  cardioData.miles = miles || '';
  const statusEl = document.getElementById('status-treadmill');
  const btnEl = document.getElementById('ex-btn-treadmill');
  if (statusEl) { statusEl.textContent = `${mins} min logged ✓`; }
  if (btnEl) btnEl.classList.add('logged');
  showToast('Cardio logged ✓');
  goBack('screen-exercises');
}

// ── SUMMARY ───────────────────────────────────────────────────────────────────
function showSummary() {
  const list = document.getElementById('summary-list');
  let html = '';
  Object.keys(sessionLogs).forEach(ex => {
    const sets = sessionLogs[ex];
    html += `<div class="summary-card"><div class="summary-ex">${ex}</div>`;
    sets.forEach(s => {
      html += `<div class="summary-detail">Set ${s.set}: ${s.reps} reps @ ${s.weight}lbs</div>`;
    });
    html += `<span class="summary-badge">${sets.length} set${sets.length>1?'s':''} logged</span></div>`;
  });
  if (cardioData.mins) {
    const label = cardioData.type === 'thursday' ? 'Run/Walk Intervals' : 'Incline Treadmill';
    html += `<div class="summary-card"><div class="summary-ex">${label}</div>`;
    html += `<div class="summary-detail">${cardioData.mins} minutes`;
    if (cardioData.rounds) html += ` · ${cardioData.rounds} ${cardioData.type==='thursday'?'rounds':'% incline'}`;
    if (cardioData.miles) html += ` · ${cardioData.miles} miles`;
    html += `</div><span class="summary-badge">Logged ✓</span></div>`;
  }
  if (!html) html = '<div style="color:var(--text3);font-size:14px;text-align:center;padding:20px;">Nothing logged yet — go back and log some sets!</div>';
  list.innerHTML = html;
  showScreen('screen-summary');
}

// ── GOOGLE SHEETS AUTH ────────────────────────────────────────────────────────
async function getAccessToken() {
  const header = { alg: 'RS256', typ: 'JWT' };
  const now = Math.floor(Date.now() / 1000);
  const claim = {
    iss: SERVICE_ACCOUNT.client_email,
    scope: 'https://www.googleapis.com/auth/spreadsheets',
    aud: 'https://oauth2.googleapis.com/token',
    exp: now + 3600,
    iat: now
  };
  const sHeader = JSON.stringify(header);
  const sClaim = JSON.stringify(claim);
  const sJWT = KJUR.jws.JWS.sign('RS256', sHeader, sClaim, SERVICE_ACCOUNT.private_key);
  const res = await fetch('https://oauth2.googleapis.com/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: `grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${sJWT}`
  });
  const data = await res.json();
  if (!data.access_token) throw new Error('Auth failed: ' + JSON.stringify(data));
  return data.access_token;
}

async function appendToSheet(sheetName, values, token) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(sheetName)}!A1:Z1000:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ values })
  });
  if (!res.ok) throw new Error('Sheet write failed: ' + await res.text());
}

// ── SEND TO SHEETS ────────────────────────────────────────────────────────────
async function sendToSheets() {
  const hasLifts = Object.keys(sessionLogs).length > 0;
  const hasCardio = !!cardioData.mins;
  if (!hasLifts && !hasCardio) { showToast('Nothing to send!', true); return; }

  showLoading(true, 'Getting access token...');
  try {
    const token = await getAccessToken();
    showLoading(true, 'Sending to Google Sheets...');
    const date = todayStr();

    // LIFTS
    if (hasLifts) {
      // Build one row per exercise with all sets summarized
      // Sheet columns: Date | Exercise | Weight (lbs) | Sets | Reps | Notes
      // We log one row per set
      const rows = [];
      Object.keys(sessionLogs).forEach(ex => {
        sessionLogs[ex].forEach(s => {
          rows.push([date, ex, s.weight, s.set, s.reps, '']);
        });
      });
      // Also log core exercises to lifts if saturday
      await appendToSheet('Lifts', rows, token);
    }

    // CARDIO
    if (hasCardio) {
      const label = cardioData.type === 'thursday' ? 'Run/Walk Intervals' : 'Incline Treadmill Walk';
      const row = [date, label, cardioData.mins, cardioData.rounds, cardioData.miles, ''];
      await appendToSheet('Cardio', [row], token);
    }

    showLoading(false);
    showToast('Sent to Google Sheets! 🎉');
    setTimeout(() => {
      sessionLogs = {};
      cardioData = {};
      showScreen('screen-days');
    }, 1800);
  } catch (err) {
    showLoading(false);
    console.error(err);
    showToast('Error: ' + err.message, true);
  }
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function showLoading(show, text) {
  const el = document.getElementById('loading');
  el.classList.toggle('show', show);
  if (text) document.getElementById('loading-text').textContent = text;
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
